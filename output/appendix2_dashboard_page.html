<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Watermark Robustness Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Jost:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
  <header>
    <h1>Watermark Robustness Dashboard</h1>
    <nav id="tabs">
      <button class="tab active" data-tab="overview">Overview</button>
      <button class="tab" data-tab="per-transform">Per-Transform</button>
      <button class="tab" data-tab="ensemble">Ensemble Matrix</button>
      <button class="tab" data-tab="per-image">Per-Image</button>
      <button class="tab" data-tab="sign-verify">Sign/Verify</button>
    </nav>
  </header>

  <main>
    <!-- Overview -->
    <section id="tab-overview" class="tab-panel active">
      <div class="stats-grid" id="stats-grid"></div>
      <div class="card chart-card">
        <h2>Mean Bit Accuracy by Transform</h2>
        <canvas id="overview-chart"></canvas>
      </div>
    </section>

    <!-- Per-Transform -->
    <section id="tab-per-transform" class="tab-panel">
      <div class="controls">
        <label for="transform-select">Transform:</label>
        <select id="transform-select"></select>
      </div>
      <div class="card chart-card">
        <h2>Method Performance vs Intensity</h2>
        <canvas id="transform-chart"></canvas>
      </div>
    </section>

    <!-- Ensemble Matrix -->
    <section id="tab-ensemble" class="tab-panel">
      <div class="card">
        <h2>Best Method per Transform &times; Intensity</h2>
        <div class="matrix-wrapper">
          <table id="ensemble-table"></table>
        </div>
      </div>
    </section>

    <!-- Per-Image -->
    <section id="tab-per-image" class="tab-panel">
      <div class="controls">
        <label for="image-select">Image:</label>
        <select id="image-select"></select>
      </div>
      <div id="per-image-content" class="per-image-content"></div>
    </section>

    <!-- Sign / Verify -->
    <section id="tab-sign-verify" class="tab-panel">
      <div class="sv-grid">
        <div class="sv-left">
          <div class="card">
            <h2>Upload &amp; Filter</h2>
            <div class="sv-upload-row">
              <label class="sv-file-btn" for="sv-file-input">Choose Image</label>
              <input type="file" id="sv-file-input" accept="image/*" hidden>
              <span id="sv-file-name" class="sv-file-name">No file chosen</span>
            </div>
            <button id="sv-upload-btn" class="sv-btn accent">Upload</button>

            <div class="sv-sep"></div>

            <label class="sv-label" for="sv-filter-select">Filter</label>
            <select id="sv-filter-select" class="sv-select"></select>

            <label class="sv-label" for="sv-intensity-input">Intensity</label>
            <div class="sv-intensity-row">
              <input type="range" id="sv-intensity-slider" min="0" max="100" value="50" class="sv-slider">
              <input type="text" id="sv-intensity-input" class="sv-intensity-text" value="">
            </div>
            <button id="sv-filter-btn" class="sv-btn" disabled>Apply Filter</button>

            <div class="sv-sep"></div>

            <label class="sv-label" for="sv-method-select">Method</label>
            <select id="sv-method-select" class="sv-select">
              <option value="trustmark">TrustMark</option>
              <option value="lsb">LSB</option>
              <option value="dct">DCT</option>
            </select>

            <label class="sv-label" for="sv-payload-input">Payload (optional)</label>
            <input type="text" id="sv-payload-input" class="sv-text-input" placeholder="auto">

            <div class="sv-btn-row">
              <button id="sv-sign-btn" class="sv-btn accent" disabled>Sign</button>
              <button id="sv-verify-btn" class="sv-btn green" disabled>Verify</button>
            </div>
          </div>
        </div>

        <div class="sv-right">
          <div class="card">
            <h2>Preview</h2>
            <div class="sv-preview-grid">
              <div class="sv-preview-slot">
                <div class="sv-preview-label">Original</div>
                <div class="sv-preview-img" id="sv-preview-original"></div>
              </div>
              <div class="sv-preview-slot">
                <div class="sv-preview-label">Filtered</div>
                <div class="sv-preview-img" id="sv-preview-filtered"></div>
              </div>
              <div class="sv-preview-slot">
                <div class="sv-preview-label">Signed</div>
                <div class="sv-preview-img" id="sv-preview-signed"></div>
              </div>
            </div>
          </div>
          <div class="card" id="sv-results-card" style="display:none">
            <h2>Verification Results</h2>
            <div class="sv-results-grid" id="sv-results"></div>
          </div>
        </div>
      </div>
      <div id="sv-status" class="sv-status"></div>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
